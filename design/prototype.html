.bar-app { font-family: var(--font-text); font-size: 13px; line-height: 16px; font-weight: 700; letter-spacing: -0.08px; }

/* MacBar — стили компонентов. Все значения — токены из tokens.json (var(--…)). */
.mb-screen { position: relative; overflow: hidden; border-radius: 10px; background: #111416; font-family: var(--font-text); color: var(--ink-1); -webkit-font-smoothing: antialiased; user-select: none; isolation: isolate; cursor: default; }
.mb-screen.has-wall { background:
  radial-gradient(60% 85% at 12% 92%, #c8643a 0%, rgba(200,100,58,0) 62%),
  radial-gradient(50% 75% at 88% 30%, #2c6e6a 0%, rgba(44,110,106,0) 66%),
  radial-gradient(38% 55% at 58% 96%, #d9a35a 0%, rgba(217,163,90,0) 62%),
  #15191b; }
[data-theme="light"] .mb-screen.has-wall { background:
  radial-gradient(60% 85% at 12% 92%, #f2a77c 0%, rgba(242,167,124,0) 62%),
  radial-gradient(50% 75% at 88% 30%, #8cc3bb 0%, rgba(140,195,187,0) 66%),
  radial-gradient(38% 55% at 58% 96%, #ecc98e 0%, rgba(236,201,142,0) 62%),
  #efe9df; }

/* ---------- бар */
.mb-bar { position: absolute; left: 0; top: 0; right: 0; height: var(--bar-height); background: var(--bar-bg); color: var(--bar-ink); display: flex; justify-content: space-between; align-items: center; padding: 0 var(--bar-pad-x); box-sizing: border-box; z-index: 2; }
.mb-screen[data-mode="glass"] .mb-bar { background: var(--bar-glass-tint); -webkit-backdrop-filter: blur(var(--blur-glass)) saturate(var(--saturate-glass)); backdrop-filter: blur(var(--blur-glass)) saturate(var(--saturate-glass)); color: var(--bar-glass-ink); box-shadow: inset 0 -1px 0 var(--bar-glass-rim); }
.mb-screen[data-mode="glass"] .mb-bar-left, .mb-screen[data-mode="glass"] .mb-bar-right { filter: drop-shadow(var(--shadow-glass-ink)); }
.mb-bar-left, .mb-bar-right { position: relative; z-index: 1; display: flex; align-items: center; height: 100%; }
.mb-bar-right { gap: var(--bar-status-gap); }
.mb-item { position: relative; height: 100%; display: flex; align-items: center; justify-content: center; padding: 0 var(--bar-item-pad-x); white-space: nowrap; transform-origin: center; box-sizing: border-box; }
.mb-item-status, .mb-item-battery { padding: 0 var(--bar-status-pad-x); }
.mb-hl { position: absolute; top: var(--bar-highlight-inset-y); height: var(--bar-highlight-h); border-radius: var(--radius-bar-highlight); background: var(--bar-highlight); opacity: 0; z-index: 0; pointer-events: none; }
.mb-screen[data-mode="glass"] .mb-hl { background: var(--bar-glass-highlight); }
.mb-gap { display: inline-block; width: var(--bar-text-icon-gap); }
.mb-dim { color: var(--bar-ink-2); }
.mb-screen[data-mode="glass"] .mb-dim { color: inherit; opacity: .6; }
.mb-tnum { font-variant-numeric: tabular-nums; }
.mb-item.is-dim .mb-ic { opacity: .45; }
.mb-red { color: var(--red); }
.mb-layout-box { display: inline-flex; align-items: center; justify-content: center; width: var(--layout-box-w); height: var(--layout-box-h); border: 1.25px solid currentColor; border-radius: var(--radius-layout-box); box-sizing: border-box; }

/* ---------- иконки */
.mb-ic { display: inline-flex; align-items: center; justify-content: center; position: relative; line-height: 1; flex: none; }
.mb-g { font-family: var(--font-icons); font-style: normal; font-weight: normal; line-height: 1; display: block; }
.mb-stack .mb-g { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.mb-ghost { opacity: .3; }
.mb-svg { display: block; overflow: visible; }

/* ---------- остров */
.mb-island { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.mb-island-shape { position: absolute; left: 0; top: 0; overflow: visible; }
.mb-island-shape path { fill: var(--island-bg); }
.mb-island-clip { position: absolute; top: 0; overflow: hidden; pointer-events: auto; color: var(--bar-ink); }
.mb-island.is-below .mb-island-clip, .mb-screen[data-mode="glass"] .mb-island-clip { box-shadow: var(--shadow-island); }
.mb-i-time { position: absolute; left: 0; right: 0; top: 0; height: var(--bar-height); display: flex; align-items: center; justify-content: center; }
.mb-i-art { position: absolute; background: linear-gradient(135deg, #e8693a 0%, #f2b45a 55%, #f7dc8b 100%); overflow: hidden; }
.mb-i-art::after { content: ""; position: absolute; left: 18%; top: 18%; width: 64%; height: 64%; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.55); box-sizing: border-box; }
.mb-i-viz { position: absolute; display: flex; align-items: center; gap: var(--viz-gap); height: 0; }
.mb-i-viz span { display: block; width: var(--viz-bar-w); border-radius: 2px; background: #f2b45a; }
.mb-i-dot { display: none; }
.mb-i-layer { position: absolute; top: var(--bar-height); box-sizing: border-box; transform-origin: 50% 0; }
.mb-i-notify { width: var(--island-notify-w); height: calc(var(--island-notify-h) - var(--bar-height)); display: flex; align-items: center; gap: var(--island-row-gap); padding: 0 var(--island-pad) 4px; }
.mb-n-icon { width: var(--notify-icon); height: var(--notify-icon); border-radius: var(--radius-notify-icon); background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; flex: none; }
.mb-n-text { flex: 1; min-width: 0; }
.mb-n-head { display: flex; align-items: baseline; justify-content: space-between; }
.mb-n-when { color: var(--island-ink-2); }
.mb-n-body { color: var(--island-ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mb-i-player { width: var(--island-player-w); height: calc(var(--island-player-h) - var(--bar-height)); }
.mb-p-text { position: absolute; left: calc(var(--island-pad) + var(--art-player) + var(--island-row-gap)); right: calc(var(--island-pad) + 30px); top: calc(var(--island-body-top) + 12px); }
.mb-p-title, .mb-p-artist { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mb-p-artist { color: var(--island-ink-2); }
.mb-p-prog { position: absolute; left: var(--island-pad); right: var(--island-pad); top: calc(var(--island-body-top) + var(--art-player) + var(--island-row-gap)); }
.mb-p-track { height: var(--progress-h); border-radius: calc(var(--progress-h) / 2); background: var(--island-track); overflow: hidden; }
.mb-p-fill { height: 100%; background: var(--bar-ink); border-radius: inherit; }
.mb-p-times { display: flex; justify-content: space-between; margin-top: 4px; color: var(--island-ink-2); }
.mb-p-ctrl { position: absolute; left: 0; right: 0; top: calc(var(--island-body-top) + var(--art-player) + var(--island-row-gap) * 2 + 14px); display: flex; justify-content: center; gap: 28px; }
.mb-p-btn { appearance: none; background: none; border: 0; padding: 0; color: var(--bar-ink); width: 44px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; }
.mb-p-btn:hover { background: var(--island-track); }

/* ---------- панели и меню */
.mb-panel-layer { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
.mb-panel, .mb-menu { position: absolute; pointer-events: auto; background: var(--panel-bg); -webkit-backdrop-filter: blur(var(--blur-panel)) saturate(var(--saturate-panel)); backdrop-filter: blur(var(--blur-panel)) saturate(var(--saturate-panel)); box-shadow: var(--shadow-panel), inset 0 0 0 1px var(--panel-rim); color: var(--ink-1); box-sizing: border-box; }
.mb-panel { width: var(--panel-w); border-radius: var(--radius-panel); padding: var(--panel-pad-y) 0; }
.mb-menu { min-width: var(--menu-min-w); border-radius: var(--radius-menu); padding: var(--menu-pad-y) 0; }
.mb-static .mb-panel, .mb-static .mb-menu { position: relative; }
.mb-header { display: flex; align-items: center; justify-content: space-between; height: var(--panel-header-h); padding: 0 var(--panel-content-x); }
.mb-header-value { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.mb-section { height: var(--panel-section-h); display: flex; align-items: flex-end; padding: 0 var(--panel-content-x) 4px; color: var(--ink-2); box-sizing: border-box; }
.mb-caption { padding: 0 var(--panel-content-x) 4px; color: var(--ink-2); }
.mb-row, .mb-link { display: flex; align-items: center; margin: 0 var(--panel-row-inset); padding: 0 calc(var(--panel-content-x) - var(--panel-row-inset)); border-radius: var(--radius-panel-row); }
.mb-row { height: var(--panel-row-h); gap: var(--panel-row-gap); }
.mb-link { height: var(--panel-link-h); }
.mb-row:hover, .mb-link:hover, .mb-row.is-hover, .mb-link.is-hover { background: var(--row-hover); }
.mb-row.is-press, .mb-link.is-press { background: var(--row-press); }
.mb-row.is-plain:hover { background: none; }
.mb-row-circle { width: var(--row-circle); height: var(--row-circle); border-radius: 50%; background: var(--fill-off); color: var(--ink-1); display: flex; align-items: center; justify-content: center; flex: none; }
.mb-row.is-on .mb-row-circle { background: var(--accent); color: var(--on-accent); }
.mb-row.is-plain .mb-row-circle { background: var(--fill-off); }
.mb-row-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.mb-row-cap { color: var(--ink-2); }
.mb-row-trail { color: var(--ink-2); display: flex; }
.mb-row-check { visibility: hidden; color: var(--ink-1); }
.mb-row.is-on .mb-row-check { visibility: visible; }
.mb-row[data-group="out"].is-on .mb-row-circle { background: var(--fill-off); color: var(--ink-1); }
.mb-sep { height: var(--stroke-hairline); background: var(--separator); margin: var(--sep-margin-y) var(--sep-inset-x); }
.mb-sep-menu { margin: var(--sep-margin-y) var(--sep-inset-x-menu); }
.is-off .mb-row, .is-off .mb-section { opacity: .35; pointer-events: none; }
.mb-switch { appearance: none; border: 0; padding: 0; position: relative; flex: none; width: var(--switch-w); height: var(--switch-h); border-radius: var(--radius-switch); background: var(--switch-off); transition: background-color 180ms cubic-bezier(0.2, 0, 0, 1); }
.mb-switch.is-on { background: var(--accent); }
.mb-knob { position: absolute; left: 1px; top: 1px; width: calc(var(--switch-h) - 2px); height: calc(var(--switch-h) - 2px); border-radius: 50%; background: var(--knob); box-shadow: var(--shadow-knob); }
.mb-switch:focus-visible, .mb-row:focus-visible, .mb-item:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
.mb-slider-row { padding: 2px var(--panel-content-x) 8px; }
.mb-slider { position: relative; height: var(--slider-h); border-radius: var(--radius-slider); background: var(--slider-track); overflow: hidden; touch-action: none; }
.mb-slider-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--knob); border-radius: var(--radius-slider); box-shadow: var(--shadow-knob); }
.mb-slider-glyph { position: absolute; left: 0; top: 0; width: var(--slider-h); height: 100%; display: flex; align-items: center; justify-content: center; color: var(--slider-glyph); }
.mb-mi { display: flex; align-items: center; height: var(--menu-row-h); margin: 0 var(--menu-row-inset); padding-right: calc(var(--menu-shortcut-x) - var(--menu-row-inset)); border-radius: var(--radius-menu-row); white-space: nowrap; }
.mb-mi-check { width: calc(var(--menu-text-x) - var(--menu-row-inset)); display: flex; justify-content: center; flex: none; }
.mb-mi-title { flex: 1; padding-right: 28px; }
.mb-mi-key { color: var(--ink-2); display: flex; align-items: center; }
.mb-mi:hover, .mb-mi.is-hover { background: var(--accent); color: var(--on-accent); }
.mb-mi:hover .mb-mi-key, .mb-mi.is-hover .mb-mi-key { color: var(--on-accent); opacity: .8; }
.mb-mi.is-blink { background: transparent !important; color: var(--ink-1) !important; }
.mb-mi.is-disabled, .mb-mi.is-disabled:hover { background: none; color: var(--ink-3); }
.mb-mi.is-disabled .mb-mi-key { color: var(--ink-3); }

/* ---------- обвязка превью и прототипа */
.mb-page { font-family: var(--font-text); color: var(--ink-1); background: var(--panel-bg-solid); padding: 20px; box-sizing: border-box; min-height: 100vh; }
.mb-controls { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-top: 14px; align-items: center; }
.mb-ctl { display: flex; align-items: center; gap: 8px; }
.mb-ctl-label { color: var(--ink-2); }
.mb-seg { display: inline-flex; background: var(--fill-off); border-radius: 8px; padding: 2px; gap: 2px; }
.mb-seg button { appearance: none; border: 0; background: none; color: var(--ink-1); font: inherit; height: 24px; padding: 0 10px; border-radius: 6px; }
.mb-seg button:hover { background: var(--row-hover); }
.mb-seg button.is-on { background: var(--accent); color: var(--on-accent); }

      if (hlState.on || hlO.x > 0) {
        hl.style.opacity = hlO.x; hl.style.left = hlX.x + "px"; hl.style.width = hlW.x + "px";
      }
      if (openPanel) placePanel();
      if (opts.onRender) opts.onRender(api);
    }

    /* ---- bar item collisions */
    function measure() {
      var sr = screen.getBoundingClientRect();
      items.forEach(function (it) {
        var prev = it.node.style.transform; it.node.style.transform = "none";
        var r = it.node.getBoundingClientRect();
        it.l = r.left - sr.left; it.r = r.right - sr.left;
        it.node.style.transform = prev;
      });
    }
    function collide(L, R) {
      var gap = num("island-side-gap");
      // остров выше бара не влияет; в покое ширина = вырез
      items.forEach(function (it) {
        var hide = it.r > L - gap && it.l < R + gap;
        if (hide !== it.hidden) {
          it.hidden = hide;
          var delay = hide ? 0 : SPEC.delays.bar_items_return_stagger_ms * Math.max(0, Math.round(Math.abs((it.side < 0 ? it.r - L : R - it.l)) / 40));
          (function (it, hide) {
            later(function () {
              it.o.spring(hide ? 0 : 1, "bar.items");
              it.dx.spring(hide ? 6 * it.side : 0, "bar.items");
            }, hide ? 0 : Math.min(delay, 100));
          })(it, hide);
          it.node.style.pointerEvents = hide ? "none" : "";
        }
      });
    }

    /* ---- island state machine */
    var timers = [];
    function clearTimers() { timers.forEach(clearTimeout); timers = []; }
    function T(fn, ms) { timers.push(later(fn, ms)); }
    function area(s) { return st[s].w * st[s].h; }
    function setState(next, instant) {
      if (next === state && !instant) return;
      clearTimers();
      var from = state; state = next;
      if (next !== "notify") prevState = next;
      var grow = area(next) >= area(from);
      var S2 = st[next];
      var shellGo = function () {
        var spr = grow ? "island.expand" : "island.collapse";
        shell.w.spring(S2.w, spr);
        shell.h.spring(S2.h, next === "notify" && grow ? "island.drop" : spr);
        shell.rb.spring(S2.rb, spr); shell.re.spring(S2.re, spr);
        var at = artTarget(next), vt = vizTarget(next);
        var as = grow ? "island.art" : "island.collapse";
        artV.x.spring(at.x, as); artV.y.spring(at.y, as); artV.s.spring(at.size, as); artV.r.spring(at.r, as);
        vizV.x.spring(vt.x, as); vizV.y.spring(vt.y, as); vizV.max.spring(vt.max, as);
      };
      // 1) уход контента (tween 120 мс)
      var music = next === "music" || next === "player";
      if (from === "notify" && next !== "notify") { layers.notify.o.tween(0, "island.content.out"); }
      if (from === "player" && next !== "player") { layers.player.o.tween(0, "island.content.out"); }
      if (!music && layers.music.o.t > 0) layers.music.o.tween(0, "island.content.out");
      if (next === "player") layers.time.o.tween(0, "island.content.out");
      if (instant) {
        ["w", "h", "rb", "re"].forEach(function (k) { shell[k].set(S2[k]); });
        var at = artTarget(next), vt = vizTarget(next);
        artV.x.set(at.x); artV.y.set(at.y); artV.s.set(at.size); artV.r.set(at.r);
        vizV.x.set(vt.x); vizV.y.set(vt.y); vizV.max.set(vt.max);
        layers.music.o.set(music ? 1 : 0); layers.notify.o.set(next === "notify" ? 1 : 0);
        layers.player.o.set(next === "player" ? 1 : 0); layers.time.o.set(next === "player" ? 0 : 1);
        layers.notify.y.set(0); layers.player.y.set(0);
        pPartV.forEach(function (pv) { pv.o.set(next === "player" ? 1 : 0); pv.y.set(0); });
        render(); return;
      }
      // 2) оболочка: при росте — сразу, при сжатии — после ухода контента + 40 мс
      if (grow) shellGo(); else T(shellGo, SPEC.tweens["island.content.out"].ms + SPEC.delays.shell_collapse_after_content_out_ms);
      // 3) приход контента
      var inDelay = grow ? SPEC.delays.content_in_after_shell_ms : SPEC.tweens["island.content.out"].ms + SPEC.delays.shell_collapse_after_content_out_ms;
      T(function () {
        if (music) layers.music.o.spring(1, "island.content");
        if (next !== "player") layers.time.o.spring(1, "island.content");
        if (next === "notify") { layers.notify.y.set(-6); layers.notify.o.spring(1, "island.content"); layers.notify.y.spring(0, "island.content"); }
        if (next === "player") {
          layers.player.o.set(1);
          pPartV.forEach(function (pv, i) {
            pv.o.set(0); pv.y.set(6);
            T(function () { pv.o.spring(1, "island.content"); pv.y.spring(0, "island.content"); }, i * SPEC.delays.content_stagger_ms);
          });
        }
      }, inDelay);
      if (next === "notify" && !opts.static) T(function () { if (!hoverIsland) setState(prevState === "notify" ? "idle" : prevState); else pendingDismiss = true; }, SPEC.delays.notify_hold_ms);
      if (opts.onState) opts.onState(next, from);
    }
    var hoverIsland = false, pendingDismiss = false;
    clip.addEventListener("pointerenter", function () { hoverIsland = true; });
    clip.addEventListener("pointerleave", function () {
      hoverIsland = false;
      if (pendingDismiss && state === "notify") { pendingDismiss = false; setState(prevState); }
    });
    clip.addEventListener("click", function (ev) {
      var btn = ev.target.closest(".mb-p-btn");
      if (btn) {
        var a = btn.dataset.a;
        if (a === "play") { D.track.playing = !D.track.playing; paintPlayer(); }
        if (a === "next" || a === "prev") { D.track.pos = 0; paintPlayer(); }
        return;
      }
      if (opts.static) return;
      if (state === "music") setState("player");
      else if (state === "player") setState("music");
      else if (state === "notify") setState(prevState === "notify" ? "idle" : prevState);
    });

    function paintPlayer() {
      var t = D.track;
      playerL.querySelector(".mb-p-title").textContent = t.title;
      playerL.querySelector(".mb-p-artist").textContent = t.artist;
      var fmt = function (s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2); };
      playerL.querySelector(".mb-p-cur").textContent = fmt(t.pos);
      playerL.querySelector(".mb-p-rem").textContent = "−" + fmt(t.len - t.pos);
      playerL.querySelector(".mb-p-fill").style.width = (t.pos / t.len * 100) + "%";
      var btns = playerL.querySelectorAll(".mb-p-btn");
      btns[0].innerHTML = MB.icon("previous", 20);
      btns[1].innerHTML = MB.icon(t.playing ? "pause" : "play", 26);
      btns[2].innerHTML = MB.icon("next", 20);
      viz.classList.toggle("is-paused", !t.playing);
    }
    function paintNotify() {
      var n = D.notify;
      notifyL.querySelector(".island-notify-title").textContent = n.title;
      notifyL.querySelector(".mb-n-when").textContent = n.when;
      notifyL.querySelector(".mb-n-body").textContent = n.body;
    }
    function clock() {
      var d = new Date();
      timeEl.textContent = d.getHours() + ":" + ("0" + d.getMinutes()).slice(-2);
    }

    /* ---- visualizer */
    var vizTimer = setInterval(function () {
      if (!D.track.playing || layers.music.o.t === 0) {
        vbars.forEach(function (b) { b.h.spring(num("viz-min-h"), "viz.bar"); }); return;
      }
      vbars.forEach(function (b, i) {
        var max = num("viz-max-h"), min = num("viz-min-h");
        b.h.spring(min + Math.random() * (max - min) * (i === 1 || i === 2 ? 1 : 0.75), "viz.bar");
      });
    }, 150);
    var progTimer = setInterval(function () {
      if (D.track.playing) { D.track.pos = (D.track.pos + 1) % D.track.len; paintPlayer(); }
      clock();
    }, 1000);

    /* ---- panels & menu tracking */
    var layer = el("div", "mb-panel-layer"); screen.appendChild(layer);
    var openId = null, openPanel = null, openItem = null;
    var hlX = new V(0), hlW = new V(0), hlO = new V(0), hlState = { on: false };
    var pOpen = new V(1), pFade = new V(1);
    function itemOf(id) { for (var i = 0; i < items.length; i++) if (items[i].id === id) return items[i]; }
    function placePanel() {
      if (!openPanel) return;
      var it = itemOf(openId);
      var w = openPanel.offsetWidth, W = screen.clientWidth, m = num("panel-margin");
      var x = clamp(it.l, m, W - w - m);
      openPanel.style.left = x + "px";
      openPanel.style.top = (num("bar-height") + num("panel-gap")) + "px";
      var ox = clamp((it.l + it.r) / 2 - x, 0, w);
      openPanel.style.transformOrigin = ox + "px 0px";
      var s = 0.94 + 0.06 * pOpen.x;
      openPanel.style.transform = "translateY(" + (-6 * (1 - pOpen.x)) + "px) scale(" + s + ")";
      openPanel.style.opacity = pFade.x;
    }
    function open(id, viaTracking) {
      if (openId === id) return;
      var it = itemOf(id); if (!it || !MENUS[id]) return;
      var animate = !openPanel || !viaTracking;
      removePanel(true);
      openId = id; openItem = it;
      it.node.classList.add("is-active");
      // плашка подсветки: мгновенно (как macOS) или ОПЦИЯ slide
      var slide = viaTracking && (opts.trackingMode === "slide");
      var bx = it.l, bw = it.r - it.l;
      if (slide) { hlX.spring(bx, "highlight.slide"); hlW.spring(bw, "highlight.slide"); }
      else { hlX.set(bx); hlW.set(bw); }
      hlO.set(1); hlState.on = true;
      var p = MB.renderPanel(MENUS[id], D, { change: paintStatus, close: close });
      layer.appendChild(p); openPanel = p;
      if (viaTracking) { pOpen.set(1); pFade.set(1); }
      else if (animate) { pOpen.set(0); pFade.set(0); pOpen.spring(1, "panel.open"); pFade.spring(1, "panel.fade"); }
      placePanel(); render();
    }
    function removePanel(instant) {
      if (!openPanel) return;
      var p = openPanel; openPanel = null;
      if (openItem) openItem.node.classList.remove("is-active");
      p._dispose && p._dispose();
      if (instant) { p.remove(); return; }
      // panel.close: tween 160 мс
      var o = new V(pFade.x), s = new V(1);
      o.tween(0, "panel.close"); s.tween(0.98, "panel.close");
      var stop = onFrame(function () {
        p.style.opacity = o.x;
        p.style.transform = "scale(" + s.x + ")";
        if (o.mode === "idle") { stop(); p.remove(); }
      });
    }
    function close() {
      if (!openId) return;
      removePanel(false);
      openId = null; hlState.on = false;
      hlO.tween(0, "highlight.off");
      requestFrame();
    }
    items.forEach(function (it) {
      it.node.addEventListener("pointerdown", function (ev) {
        ev.stopPropagation();
        if (openId === it.id) close(); else open(it.id, false);
      });
      it.node.addEventListener("pointerenter", function () {
        if (openId && openId !== it.id && MENUS[it.id]) open(it.id, true); // menu tracking
      });
    });
    screen.addEventListener("pointerdown", function () { close(); if (state === "player" && !opts.static) setState("music"); });
    var keyH = function (ev) {
      if (!screen.isConnected) return;
      if (ev.key === "Escape") close();
      if (openId && (ev.key === "ArrowRight" || ev.key === "ArrowLeft")) {
        var ids = items.filter(function (i) { return MENUS[i.id] && !i.hidden; }).map(function (i) { return i.id; });
        var k = ids.indexOf(openId) + (ev.key === "ArrowRight" ? 1 : -1);
        if (k >= 0 && k < ids.length) open(ids[k], true);
      }
    };
    document.addEventListener("keydown", keyH);

    /* ---- init */
    paintStatus(); paintPlayer(); paintNotify(); clock();
    onFrame(render);
    requestAnimationFrame(function () { measure(); render(); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { measure(); render(); });

    var api = {
      screen: screen, data: D,
      get state() { return state; },
      setState: setState,
      notify: function () { if (state === "player") setState("music"); setTimeout(function () { setState("notify"); }, state === "player" ? 200 : 0); },
      setMode: function (m) { screen.dataset.mode = m; render(); },
      setTracking: function (m) { opts.trackingMode = m; },
      open: function (id) { open(id, false); }, close: close,
      refresh: function () { paintStatus(); paintPlayer(); render(); },
      shell: shell
    };
    return api;
  };
})();
</script><meta charset="utf-8"><title>MacBar — прототип</title></head>
<body>
<div id="root" class="mb-page"></div>
<script>
(function () {
  var MB = window.MacBar, root = document.getElementById("root");
  var host = document.createElement("div"); root.appendChild(host);
  var readout = document.createElement("div");
  var desk = MB.Desktop(host, { width: 1000, height: 560, state: "idle", onState: function (s, f) { show(s, f); syncIsland(); } });

  function show(s, f) {
    var name = s === "notify" ? "island.expand + island.drop" : (MB.ISLAND[s].w * MB.ISLAND[s].h >= MB.ISLAND[f].w * MB.ISLAND[f].h ? "island.expand" : "island.collapse");
    var p = MB.SPEC.springs[name.split(" ")[0]];
    readout.textContent = f + " → " + s + " · " + name + " · response " + p.response.toFixed(2) + " с · ζ " + p.dampingFraction.toFixed(2) +
      " · k " + p.stiffness.toFixed(1) + " · c " + p.damping.toFixed(2) + " · " + MB.ISLAND[s].w + "×" + MB.ISLAND[s].h + ", r " + MB.ISLAND[s].rb;
  }

  var controls = document.createElement("div"); controls.className = "mb-controls bar-menu"; root.appendChild(controls);
  function seg(label, options, onPick, initial) {
    var wrap = document.createElement("div"); wrap.className = "mb-ctl";
    var l = document.createElement("span"); l.className = "mb-ctl-label"; l.textContent = label; wrap.appendChild(l);
    var s = document.createElement("div"); s.className = "mb-seg"; wrap.appendChild(s);
    var btns = options.map(function (o) {
      var b = document.createElement("button"); b.textContent = o[1]; b.dataset.v = o[0];
      b.addEventListener("click", function () { pick(o[0]); onPick(o[0]); });
      s.appendChild(b); return b;
    });
    function pick(v) { btns.forEach(function (b) { b.classList.toggle("is-on", b.dataset.v === v); }); }
    pick(initial); controls.appendChild(wrap);
    return pick;
  }
  var pickIsland = seg("Остров", [["idle", "Покой"], ["music", "Музыка"], ["player", "Плеер"], ["notify", "Уведомление"]], function (v) {
    if (v === "notify") desk.notify(); else desk.setState(v);
  }, "idle");
  function syncIsland() { pickIsland(desk.state); }
  seg("Бар", [["solid", "Solid"], ["glass", "Liquid Glass"]], function (v) { desk.setMode(v); }, "solid");
  seg("Тема", [["dark", "Тёмная"], ["light", "Светлая"]], function (v) { document.documentElement.setAttribute("data-theme", v); desk.refresh(); },
    document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark");
  seg("Скорость", [["1", "1×"], ["5", "0.2× (замедленно)"]], function (v) { MB.timeScale = +v; }, "1");
  seg("Menu tracking", [["instant", "Мгновенно (macOS)"], ["slide", "Слайд плашки"]], function (v) { desk.setTracking(v); }, "instant");
  seg("Батарея", [["87", "87 %"], ["c", "Зарядка"], ["8", "8 %"]], function (v) {
    var D = desk.data; if (v === "c") { D.charging = true; D.battery = 87; } else { D.charging = false; D.battery = +v; } desk.refresh();
  }, "87");

  readout.className = "mb-readout island-meta"; root.appendChild(readout);
  var hint = document.createElement("div"); hint.className = "mb-hint panel-caption";
  hint.textContent = "Нажми на иконку или пункт бара, затем веди курсор вдоль бара — панели переключаются без анимации (menu tracking), ← → тоже работают. Клик по острову в «Музыке» раскрывает плеер, клик мимо — сворачивает. Наведи на уведомление — оно не уйдёт, пока курсор на нём.";
  root.appendChild(hint);
  readout.textContent = "Пружина последнего перехода появится здесь.";
})();
</script>
</body>
